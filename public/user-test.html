<!DOCTYPE html>
<html>
<body>
  <h1>اختبار إرسال الطلب</h1>
  <input type="text" id="msg" placeholder="الطلب">
  <button onclick="send()">إرسال</button>
  <pre id="output"></pre>
  <script>
    const token = localStorage.getItem('token');
    if (!token) {
      // سجل دخول سريع
      fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: 'test', password: '123' })
      }).then(r=>r.json()).then(data => {
        localStorage.setItem('token', data.token);
        location.reload();
      });
    } else {
      document.getElementById('output').innerText = 'Token موجود، أرسل طلبك';
    }
    async function send() {
      const msg = document.getElementById('msg').value;
      const res = await fetch('/api/user/request', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
        body: JSON.stringify({ message: msg })
      });
      const data = await res.json();
      document.getElementById('output').innerText = JSON.stringify(data, null, 2);
    }
  </script>
</body>
</html>
